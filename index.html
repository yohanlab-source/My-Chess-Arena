<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Quest - Version Cel-Shading & Vraies Règles</title>
    <!-- Chargement de la bibliothèque officielle des règles d'échecs -->
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: linear-gradient(135deg, #2c1810, #1a0f0a);
            color: #f4e4c1;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* BANDEAU TOP STYLE MEDIEVAL */
        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #2c1810;
            border: 4px solid #4a2f1b;
            border-bottom: 8px solid #4a2f1b;
            border-radius: 12px 12px 0 0;
            font-weight: bold;
            color: #ffd700;
            box-shadow: 0 -4px 0 #000;
        }

        .mode-title { font-size: 1.2rem; text-shadow: 2px 2px 0 #000; }
        .view-badge { background: #ffd700; color: #000; padding: 4px 8px; border-radius: 6px; border: 2px solid #000; font-size: 0.8rem; box-shadow: 2px 2px 0 #000; }

        /* CONTENEUR DE L'ÉCHIQUIER PARFAIT */
        .board-container {
            width: 95vw;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background: #4a2f1b;
            border: 8px solid #4a2f1b;
            border-bottom: 14px solid #4a2f1b;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 0 #000, 0 20px 30px rgba(0,0,0,0.6);
        }

        /* GRILLE 8X8 PARFAITE */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            border: 4px solid #000;
            background: #000;
            gap: 0;
        }

        /* CASES EN STYLE CEL-SHADING */
        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { 
            background: #f0d9b5; 
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.08);
        }
        .square.dark { 
            background: #b58863; 
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.15);
        }

        /* Effet de sélection de case active */
        .square.selected {
            background: #ffd700 !important;
            box-shadow: inset 0 0 0 4px #000 !important;
        }

        /* Point vert pour indiquer les mouvements légaux autorisés */
        .square.legal-hint::after {
            content: '';
            position: absolute;
            width: 24%;
            height: 24%;
            background: #228b22;
            border-radius: 50%;
            border: 2px solid #000;
            z-index: 5;
        }

        /* 👑 PIÈCES EN CEL-SHADING (Gros contours noirs, couleurs vives effet BD) */
        .piece {
            font-size: clamp(32px, 9vw, 52px);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: transform 0.1s;
            z-index: 10;
            filter: drop-shadow(2px 0 0 #000) 
                    drop-shadow(-2px 0 0 #000) 
                    drop-shadow(0 2px 0 #000) 
                    drop-shadow(0 -2px 0 #000)
                    drop-shadow(3px 4px 0px rgba(0,0,0,0.4));
        }

        .piece.w { color: #ffffff; } /* Blancs */
        .piece.b { color: #d2691e; } /* Noirs (style Marron/Orange BD) */

        .square:active .piece {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- BANDEAU DE JEU -->
    <div class="top-bar">
        <span class="mode-title" id="game-status">🏹 Tour des Blancs</span>
        <span class="view-badge">CEL-SHADING + REGLES</span>
    </div>

    <!-- ÉCHIQUIER -->
    <div class="board-container">
        <div class="board" id="chessboard"></div>
    </div>

    <script>
        // Initialisation du moteur officiel Chess.js
        const chess = new Chess();
        const boardElement = document.getElementById('chessboard');
        let selectedSquareName = null;

        // Dictionnaire de conversion pour l'affichage visuel des personnages dessinés
        const unicodePieces = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♓', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        // Génère le nom d'une case d'échecs (ex: col 0, row 0 -> "a8")
        function getSquareName(row, col) {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
            return files[col] + ranks[row];
        }

        // Met à jour et redessine l'échiquier complet selon l'état réel du moteur de règles
        function renderBoard() {
            boardElement.innerHTML = '';
            const currentBoard = chess.board(); // Récupère la position des pièces du moteur

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const squareElement = document.createElement('div');
                    const squareName = getSquareName(row, col);
                    
                    const isLight = (row + col) % 2 === 0;
                    squareElement.className = `square ${isLight ? 'light' : 'dark'}`;
                    squareElement.id = squareName;

                    // Si une pièce est sur cette case selon le moteur
                    const piece = currentBoard[row][col];
                    if (piece) {
                        const pieceElement = document.createElement('div');
                        pieceElement.className = `piece ${piece.color}`;
                        // Utilise le bon symbole cel-shaded (majuscule pour blanc, minuscule pour noir)
                        const symbol = piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
                        pieceElement.innerText = unicodePieces[symbol];
                        squareElement.appendChild(pieceElement);
                    }

                    // Ajout de l'interaction intelligente au clic
                    squareElement.addEventListener('click', () => handleSquareClick(squareName));

                    boardElement.appendChild(squareElement);
                }
            }

            // Met à jour le bandeau supérieur (Tour des joueurs ou Échec et mat)
            const statusElement = document.getElementById('game-status');
            if (chess.in_checkmate()) {
                statusElement.innerText = "👑 ÉCHEC ET MAT ! 🎉";
            } else if (chess.in_draw()) {
                statusElement.innerText = "🤝 PARTIE NULLE !";
            } else {
                statusElement.innerText = chess.turn() === 'w' ? "🏹 Tour des Blancs" : "🤖 Tour des Noirs (Bot)";
            }
        }

        // Gestionnaire d'analyse des clics et de validation des règles
        function handleSquareClick(squareName) {
            // Nettoyage des points verts de suggestion précédents
            document.querySelectorAll('.square').forEach(el => {
                el.classList.remove('legal-hint');
                el.classList.remove('selected');
            });

            // ÉTAPE 1 : Si aucune case n'était sélectionnée auparavant
            if (selectedSquareName === null) {
                const piece = chess.get(squareName);
                // On ne sélectionne que si la case contient une pièce appartenant au joueur actif
                if (piece && piece.color === chess.turn()) {
                    selectedSquareName = squareName;
                    document.getElementById(squareName).classList.add('selected');
                    
                    // Récupère la liste de tous les déplacements légaux calculés par Chess.js pour cette pièce
                    const moves = chess.moves({ square: squareName, verbose: true });
                    moves.forEach(move => {
                        document.getElementById(move.to).classList.add('legal-hint');
                    });
                }
            } 
            // ÉTAPE 2 : Si le joueur clique sur sa case de destination légale
            else {
                const move = chess.move({
                    from: selectedSquareName,
                    to: squareName,
                    promotion: 'q' // Promotion automatique en Reine en cas d'arrivée au bout
                });

                selectedSquareName = null; // Réinitialise la sélection
                renderBoard(); // Redessine le plateau mis à jour

                // Si le coup était valide et que c'est maintenant au tour des Noirs, on simule le Bot (IA)
                if (move && !chess.game_over() && chess.turn() === 'b') {
                    setTimeout(makeComputerMove, 600); // Le bot réfléchit 0,6 seconde
                }
            }
        }

        // Logique de l'IA (Mode Moyen 1 : choisit un des coups légaux au hasard de façon valide)
        function makeComputerMove() {
            const moves = chess.moves();
            if (moves.length > 0) {
                const randomMove = moves[Math.floor(Math.random() * moves.length)];
                chess.move(randomMove);
                renderBoard();
            }
        }
