                        if (this.engine.gameOver) return;

                        const row = parseInt(square.dataset.row);
                        const col = parseInt(square.dataset.col);

                        // If we're in drop mode (Crazyhouse)
                        if (this.selectedPieceForDrop) {
                            // Check if this is a valid drop square
                            if (!this.engine.board[row][col]) {
                                if (this.selectedPieceForDrop === 'pawn' && (row === 0 || row === 7)) {
                                    return; // Can't drop pawns on first/last rank
                                }

                                this.engine.makeMove(null, [row, col], null, false);
                                this.selectedPieceForDrop = null;
                                this.renderBoard();
                                this.renderReserves();

                                // For Fog of War
                                if (this.gameMode === 'FogOfWar') {
                                    this.engine.updateVisibleSquares();
                                    this.renderFogOverlay();
                                }

                                this.afterPlayerMove();
                            }
                            return;
                        }

                        // If a square is already selected
                        if (this.selectedSquare) {
                            const [selRow, selCol] = this.selectedSquare;

                            // Check if this is a legal move
                            const move = this.legalMoves.find(m =>
                                m.from && m.from[0] === selRow && m.from[1] === selCol &&
                                m.to[0] === row && m.to[1] === col
                            );

                            if (move) {
                                // Check for pawn promotion
                                const piece = this.engine.board[selRow][selCol];
                                if (piece.type === 'pawn' &&
                                    ((piece.color === 'white' && row === 0) ||
                                     (piece.color === 'black' && row === 7))) {
                                    this.selectedSquare = null;
                                    this.legalMoves = [];
                                    this.renderBoard();

                                    // Show promotion modal
                                    const modal = document.getElementById('promotion-modal');
                                    modal.classList.remove('hidden');

                                    // Set up callback
                                    this.promotionCallback = (promotionType) => {
                                        this.engine.makeMove([selRow, selCol], [row, col], promotionType);
                                        this.renderBoard();
                                        this.renderReserves();

                                        // For Fog of War
                                        if (this.gameMode === 'FogOfWar') {
                                            this.engine.updateVisibleSquares();
                                            this.renderFogOverlay();
                                        }

                                        this.afterPlayerMove();
                                    };
                                    return;
                                }

                                // Make the move
                                this.engine.makeMove([selRow, selCol], [row, col]);

                                // For Duck Chess: place duck after move
                                if (this.gameMode === 'DuckChess' && !this.engine.gameOver) {
                                    this.showDuckPlacement();
                                } else {
                                    // Continue with AI move if needed
                                    this.afterPlayerMove();
                                }
                            } else {
                                // If clicked on another piece of the same color, select it
                                const piece = this.engine.board[row][col];
                                if (piece && piece.color === this.engine.turn) {
                                    this.selectedSquare = [row, col];
                                    this.legalMoves = this.engine.getPieceMoves(piece, row, col);
                                } else {
                                    // Deselect
                                    this.selectedSquare = null;
                                    this.legalMoves = [];
                                }
                            }
                        } else {
                            // No square selected, try to select this one
                            const piece = this.engine.board[row][col];
                            if (piece && piece.color === this.engine.turn) {
                                this.selectedSquare = [row, col];
                                this.legalMoves = this.engine.getPieceMoves(piece, row, col);
                            }
                        }

                        this.renderBoard();

                        // For Fog of War, update visibility after move
                        if (this.gameMode === 'FogOfWar') {
                            this.engine.updateVisibleSquares();
                            this.renderFogOverlay();
                        }
                    });
                });
            }

            afterPlayerMove() {
                this.selectedSquare = null;
                this.legalMoves = [];
                this.selectedPieceForDrop = null;
                this.renderReserves();

                // Check if game is over
                if (this.engine.gameOver) {
                    this.updateGameStatus();
                    this.stopAllTimers();
                    return;
                }

                // If it's AI's turn
                if (this.isVsAI && this.engine.turn === 'black') {
                    this.stopTimer('white');
                    this.startTimer('black');

                    this.ai.getMove(this.engine, (move) => {
                        if (move) {
                            if (move.from) {
                                // Regular move
                                this.engine.makeMove(move.from, move.to, move.promotion);
                            } else {
                                // Drop move in Crazyhouse
                                this.engine.makeMove(null, move.to, null);
                            }

                            // For Duck Chess: AI places duck
                            if (this.gameMode === 'DuckChess' && !this.engine.gameOver) {
                                // Find a random empty square for the duck
                                const emptySquares = [];
                                for (let row = 0; row < 8; row++) {
                                    for (let col = 0; col < 8; col++) {
                                        if (!this.engine.board[row][col] &&
                                            !(this.engine.duckPosition &&
                                              this.engine.duckPosition[0] === row &&
                                              this.engine.duckPosition[1] === col)) {
                                            emptySquares.push([row, col]);
                                        }
                                    }
                                }
                                if (emptySquares.length > 0) {
                                    const [row, col] = emptySquares[Math.floor(Math.random() * emptySquares.length)];
                                    this.engine.placeDuck(row, col);
                                }
                            }

                            this.renderBoard();
                            this.renderReserves();

                            // For Fog of War
                            if (this.gameMode === 'FogOfWar') {
                                this.engine.updateVisibleSquares();
                                this.renderFogOverlay();
                            }

                            this.updateGameStatus();
                            this.afterPlayerMove();
                        }
                    });
                } else {
                    // Switch timers
                    this.stopTimer(this.engine.turn === 'white' ? 'black' : 'white');
                    this.startTimer(this.engine.turn);
                }
            }

            showDuckPlacement() {
                // Highlight all empty squares for duck placement
                const squares = document.querySelectorAll('#chess-board .square');
                squares.forEach(square => {
                    const row = parseInt(square.dataset.row);
                    const col = parseInt(square.dataset.col);
                    if (!this.engine.board[row][col] &&
                        !(this.engine.duckPosition &&
                          this.engine.duckPosition[0] === row &&
                          this.engine.duckPosition[1] === col)) {
                        square.classList.add('highlight');
                    }
                });

                // Add one-time click handler for duck placement
                const handleDuckPlacement = (e) => {
                    const square = e.target.closest('.square');
                    if (!square) return;

                    const row = parseInt(square.dataset.row);
                    const col = parseInt(square.dataset.col);

                    if (!this.engine.board[row][col] &&
                        !(this.engine.duckPosition &&
                          this.engine.duckPosition[0] === row &&
                          this.engine.duckPosition[1] === col)) {
                        this.engine.placeDuck(row, col);
                        this.renderBoard();
                        if (this.gameMode === 'FogOfWar') {
                            this.engine.updateVisibleSquares();
                            this.renderFogOverlay();
                        }
                        this.afterPlayerMove();
                    }

                    // Remove the handler and highlights
                    squares.forEach(s => s.classList.remove('highlight'));
                    document.removeEventListener('click', handleDuckPlacement);
                };

                document.addEventListener('click', handleDuckPlacement, { once: true });
            }

            renderFogOverlay() {
                const overlay = document.getElementById('fog-overlay');
                overlay.innerHTML = '';
                overlay.classList.remove('hidden');

                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.className = `fog-square ${this.engine.visibleSquares.has(`${row},${col}`) ? 'visible' : ''}`;
                        square.style.gridRow = row + 1;
                        square.style.gridColumn = col + 1;
                        overlay.appendChild(square);
                    }
                }
            }

            updateGameStatus() {
                const statusEl = document.getElementById('game-status');
                const turnEl = document.getElementById('player-turn');
                const opponentEl = document.getElementById('opponent-turn');

                if (this.engine.checkmate) {
                    const winner = this.engine.turn === 'white' ? 'Black' : 'White';
                    statusEl.textContent = `CHECKMATE! ${winner} WINS!`;
                    statusEl.style.color = winner === 'White' ? 'var(--white-piece)' : 'var(--black-piece)';
                } else if (this.engine.stalemate) {
                    statusEl.textContent = 'STALEMATE! DRAW';
                    statusEl.style.color = '#aaa';
                } else if (this.engine.gameOver) {
                    // Handle variant-specific wins
                    if (this.gameMode === 'KingOfTheHill') {
                        const winner = this.engine.turn === 'white' ? 'Black' : 'White';
                        statusEl.textContent = `${winner} WINS BY KING OF THE HILL!`;
                        statusEl.style.color = winner === 'White' ? 'var(--white-piece)' : 'var(--black-piece)';
                    } else if (this.gameMode === 'PawnRace') {
                        const winner = this.engine.turn === 'white' ? 'Black' : 'White';
                        statusEl.textContent = `${winner} WINS THE PAWN RACE!`;
                        statusEl.style.color = winner === 'White' ? 'var(--white-piece)' : 'var(--black-piece)';
                    } else if (this.gameMode === 'Horde') {
                        let whitePawns = 0;
                        for (let row = 0; row < 8; row++) {
                            for (let col = 0; col < 8; col++) {
                                const piece = this.engine.board[row][col];
                                if (piece && piece.type === 'pawn' && piece.color === 'white') {
                                    whitePawns++;
                                }
                            }
                        }
                        if (whitePawns === 0) {
                            statusEl.textContent = 'BLACK WINS! All white pawns captured.';
                            statusEl.style.color = 'var(--black-piece)';
                        } else {
                            statusEl.textContent = 'WHITE WINS BY CHECKMATE!';
                            statusEl.style.color = 'var(--white-piece)';
                        }
                    } else if (this.gameMode === 'DuckChess') {
                        const winner = this.engine.turn === 'white' ? 'Black' : 'White';
                        statusEl.textContent = `${winner} WINS BY CAPTURING THE KING!`;
                        statusEl.style.color = winner === 'White' ? 'var(--white-piece)' : 'var(--black-piece)';
                    } else {
                        statusEl.textContent = 'GAME OVER';
                        statusEl.style.color = '#aaa';
                    }
                } else {
                    statusEl.textContent = this.engine.check ?
                        `${this.engine.turn === 'white' ? 'White' : 'Black'} IS IN CHECK!` :
                        'In Progress';
                    statusEl.style.color = this.engine.check ? '#ff0000' : '#eee';

                    turnEl.textContent = `${this.engine.turn === 'white' ? 'White' : 'Black'}'s Turn`;
                    opponentEl.textContent = `${this.engine.turn === 'white' ? 'Black' : 'White'}'s Turn`;
                }
            }

            startTimer(color) {
                if (!this.engine.modeConfig.hasTimer) return;

                this.stopTimer(color);

                this.timerIntervals[color] = setInterval(() => {
                    if (this.timers[color] > 0) {
                        this.timers[color]--;
                        this.updateTimers();
                    } else {
                        this.stopTimer(color);
                        this.engine.gameOver = true;
                        this.updateGameStatus();
                    }
                }, 1000);
            }

            stopTimer(color) {
                if (this.timerIntervals[color]) {
                    clearInterval(this.timerIntervals[color]);
                    this.timerIntervals[color] = null;
                }
            }

            stopAllTimers() {
                this.stopTimer('white');
                this.stopTimer('black');
            }

            updateTimers() {
                const whiteTimer = document.getElementById('white-timer');
                const blackTimer = document.getElementById('black-timer');

                whiteTimer.textContent = this.formatTime(this.timers.white);
                blackTimer.textContent = this.formatTime(this.timers.black);
            }

            formatTime(seconds) {
                if (seconds <= 0) return '00:00:00';

                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ChessUI();
        });
    </script>
</body>
</html>
