<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Quest - Cel Shading</title>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #1a0f0a;
            color: #ffd700;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }

        /* BANDEAU SUPÉRIEUR */
        .top-bar {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #2c1810;
            border: 4px solid #4a2f1b;
            border-bottom: 6px solid #4a2f1b;
            border-radius: 12px 12px 0 0;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .status-text { font-size: 1.1rem; text-shadow: 2px 2px 0 #000; }
        .badge { background: #ffd700; color: #000; padding: 3px 8px; border-radius: 6px; border: 2px solid #000; font-size: 0.75rem; font-weight: bold; box-shadow: 2px 2px 0 #000; }

        /* CONTENEUR DE L'ÉCHIQUIER */
        .board-container {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            background: #4a2f1b;
            border: 6px solid #4a2f1b;
            border-bottom: 12px solid #4a2f1b;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        /* LA GRILLE COMPLÈTE BLINDÉE */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            background: #000;
            border: 3px solid #000;
            gap: 0;
        }

        /* STYLE DES CASES CEL-SHADING */
        .tile {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .tile.light-tile { background: #f0d9b5; box-shadow: inset -3px -3px 0px rgba(0,0,0,0.06); }
        .tile.dark-tile { background: #b58863; box-shadow: inset -3px -3px 0px rgba(0,0,0,0.12); }

        /* Sélection de case active */
        .tile.active-select { background: #ffcc00 !important; box-shadow: inset 0 0 0 3px #000 !important; }

        /* Points verts d'aide aux mouvements légaux */
        .tile.valid-destination::after {
            content: '';
            position: absolute;
            width: 26%;
            height: 26%;
            background: #2ebd2e;
            border-radius: 50%;
            border: 2px solid #000;
            z-index: 5;
        }

        /* STYLE DES FIGURINES AVEC CONTOUR BANDÉE DESSINÉE (CEL-SHADING) */
        .avatar-piece {
            font-size: clamp(28px, 8vw, 44px);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 10;
            transition: transform 0.1s;
            /* L'effet de contour noir de dessin animé */
            filter: drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(2px 3px 0px rgba(0,0,0,0.4));
        }
        .avatar-piece.w { color: #ffffff; }
        .avatar-piece.b { color: #e67e22; } /* Orange vif style BD pour l'adversaire */

        .tile:active .avatar-piece { transform: scale(1.15); }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="status-text" id="turn-indicator">🏹 Tour des Blancs</span>
        <span class="badge">MODE BANDE-DESSINÉE</span>
    </div>

    <div class="board-container">
        <div class="grid-board" id="board-matrix"></div>
    </div>

    <script>
        const gameEngine = new Chess();
        const matrixElement = document.getElementById('board-matrix');
        let selectedSquare = null;

        const retroSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function convertCoords(r, c) {
            const letters = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const numbers = ['8', '7', '6', '5', '4', '3', '2', '1'];
            return letters[c] + numbers[r];
        }

        function refreshInterface() {
            matrixElement.innerHTML = '';
            const boardState = gameEngine.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const tileElement = document.createElement('div');
                    const squareCode = convertCoords(r, c);
                    
                    const isLight = (r + c) % 2 === 0;
                    tileElement.className = `tile ${isLight ? 'light-tile' : 'dark-tile'}`;
                    tileElement.id = squareCode;

                    const pieceData = boardState[r][c];
                    if (pieceData) {
                        const pieceIcon = document.createElement('div');
                        pieceIcon.className = `avatar-piece ${pieceData.color}`;
                        const lookupKey = pieceData.color === 'w' ? pieceData.type.toUpperCase() : pieceData.type.toLowerCase();
                        pieceIcon.innerText = retroSymbols[lookupKey];
                        tileElement.appendChild(pieceIcon);
                    }

                    tileElement.addEventListener('click', () => processInput(squareCode));
                    matrixElement.appendChild(tileElement);
                }
            }

            const header = document.getElementById('turn-indicator');
            if (gameEngine.in_checkmate()) { header.innerText = "👑 ÉCHEC ET MAT ! 🎉"; }
            else if (gameEngine.in_draw()) { header.innerText = "🤝 MATCH NUL !"; }
            else { header.innerText = gameEngine.turn() === 'w' ? "🏹 Tour des Blancs" : "🤖 Réflexion du Robot..."; }
        }

        function processInput(squareCode) {
            document.querySelectorAll('.tile').forEach(el => {
                el.classList.remove('valid-destination');
                el.classList.remove('active-select');
            });

            if (selectedSquare === null) {
                const targets = gameEngine.get(squareCode);
                if (targets && targets.color === gameEngine.turn()) {
                    selectedSquare = squareCode;
                    document.getElementById(squareCode).classList.add('active-select');
                    
                    const legalOptions = gameEngine.moves({ square: squareCode, verbose: true });
                    legalOptions.forEach(opt => {
                        document.getElementById(opt.to).classList.add('valid-destination');
                    });
                }
            } else {
                const action = gameEngine.move({ from: selectedSquare, to: squareCode, promotion: 'q' });
                selectedSquare = null;
                refreshInterface();

                if (action && !gameEngine.game_over() && gameEngine.turn() === 'b') {
                    setTimeout(triggerBot, 500);
                }
            }
        }

        function triggerBot() {
            const options = gameEngine.moves();
            if (options.length > 0) {
                const pick = options[Math.floor(Math.random() * options.length)];
                gameEngine.move(pick);
                refreshInterface();
            }
        }

        refreshInterface();
    </script>
</body>
</html>
