<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Quest - Version Cel-Shading Propre</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: linear-gradient(135deg, #2c1810, #1a0f0a);
            color: #f4e4c1;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* BANDEAU TOP STYLE MEDIEVAL */
        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #2c1810;
            border: 4px solid #4a2f1b;
            border-bottom: 8px solid #4a2f1b;
            border-radius: 12px 12px 0 0;
            font-weight: bold;
            color: #ffd700;
            box-shadow: 0 -4px 0 #000;
        }

        .mode-title { font-size: 1.2rem; text-shadow: 2px 2px 0 #000; }
        .view-badge { background: #ffd700; color: #000; padding: 4px 8px; border-radius: 6px; border: 2px solid #000; font-size: 0.8rem; box-shadow: 2px 2px 0 #000; }

        /* CONTENEUR DE L'ÉCHIQUIER PARAMÉTRÉ AU PIXEL PRÈS */
        .board-container {
            width: 95vw;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background: #4a2f1b;
            border: 8px solid #4a2f1b;
            border-bottom: 14px solid #4a2f1b;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 0 #000, 0 20px 30px rgba(0,0,0,0.6);
        }

        /* GRILLE 8X8 PARFAITE */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            border: 4px solid #000;
            background: #000;
            gap: 0;
        }

        /* CASES EN STYLE CEL-SHADING (Ombres plates et contours nets) */
        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.15);
        }

        .square.light { 
            background: #f0d9b5; 
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.08);
        }
        .square.dark { 
            background: #b58863; 
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.15);
        }

        /* Effet de sélection de case */
        .square.selected {
            background: #ffd700 !important;
            box-shadow: inset 0 0 0 4px #000 !important;
        }

        /* 👑 STYLE DES PERSONNAGES EN CEL-SHADING (Gros contours noirs, couleurs vives effet BD) */
        .piece {
            font-size: clamp(32px, 9vw, 52px);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: transform 0.1s;
            z-index: 10;
            /* L'astuce magique du Cel-shading en CSS : un énorme contour noir parfait autour des personnages */
            filter: drop-shadow(2px 0 0 #000) 
                    drop-shadow(-2px 0 0 #000) 
                    drop-shadow(0 2px 0 #000) 
                    drop-shadow(0 -2px 0 #000)
                    drop-shadow(3px 4px 0px rgba(0,0,0,0.4));
        }

        /* Couleur vibrante pour l'armée Blanche (Cel-shaded) */
        .piece.white-piece {
            color: #ffffff;
        }

        /* Couleur vibrante pour l'armée Marron/Noire (Cel-shaded) */
        .piece.black-piece {
            color: #d2691e; /* Un beau orange/marron de bande dessinée pour trancher sur le plateau */
        }

        .square:active .piece {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- BANDEAU DE JEU -->
    <div class="top-bar">
        <span class="mode-title">🏹 Normal — 👑 vs 🤖</span>
        <span class="view-badge">CEL-SHADING 2.5D</span>
    </div>

    <!-- CONTENEUR BLINDÉ DE L'ÉCHIQUIER -->
    <div class="board-container">
        <div class="board" id="chessboard"></div>
    </div>

    <script>
        // Tableau officiel complet de départ pour éviter TOUT oubli de pièce
        const startingBoard = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'], // Ligne 8 (Noirs)
            ['♟','♟','♟','♟','♟','♟','♟','♟'], // Ligne 7 (Noirs)
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['♙','♙','♙','♙','♙','♙','♙','♙'], // Ligne 2 (Blancs)
            ['♖','♘','♗','♕','♔','♗','♘','♖']  // Ligne 1 (Blancs)
        ];

        const boardElement = document.getElementById('chessboard');
        let selectedSquare = null;

        // Génération automatique et ultra-robuste des 64 cases identiques
        function createBoard() {
            boardElement.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    
                    // Alternance parfaite des couleurs des cases
                    const isLight = (row + col) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.row = row;
                    square.dataset.col = col;

                    // Récupération de la pièce
                    const pieceSymbol = startingBoard[row][col];
                    if (pieceSymbol !== '') {
                        const pieceElement = document.createElement('div');
                        // Attribution de la faction (Blancs en bas, Noirs en haut)
                        const isWhite = row >= 6;
                        pieceElement.className = `piece ${isWhite ? 'white-piece' : 'black-piece'}`;
                        pieceElement.innerText = pieceSymbol;
                        square.appendChild(pieceElement);
                    }

                    // Logique de clic simple (sélection visuelle sans bug)
                    square.addEventListener('click', () => {
                        if (selectedSquare) {
                            selectedSquare.classList.remove('selected');
                        }
                        if (selectedSquare === square) {
                            selectedSquare = null;
                        } else {
                            square.classList.add('selected');
                            selectedSquare = square;
                        }
                    });

                    boardElement.appendChild(square);
                }
            }
        }

        // Lancement immédiat de la grille
        createBoard();
    </script>
</body>
</html>
